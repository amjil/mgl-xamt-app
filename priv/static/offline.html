<!DOCTYPE html>
<html lang="mn-Mong" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101412" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <title>Xamt · Offline</title>
    <link rel="manifest" href="/pwa/manifest.json" />
    <link rel="preload" href="/fonts/OyunQaganTig.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: "Oyun Qagan Tig";
        src: url("/fonts/OyunQaganTig.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --bg: #101412;
        --bg-2: #181e1c;
        --text: #f1eee6;
        --muted: #9aa396;
        --accent: #4aa584;
        --line: rgba(201, 165, 106, 0.16);
        --font: "Oyun Qagan Tig", "Noto Sans Mongolian", "Mongolian Baiti", serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4efe4;
          --bg-2: #fbf7ee;
          --text: #1c221e;
          --muted: #5f6a5c;
          --accent: #2f7d5f;
          --line: rgba(120, 95, 50, 0.2);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: var(--font);
      }

      .card {
        writing-mode: vertical-lr;
        text-orientation: mixed;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.1rem;
        max-height: min(36rem, calc(100vh - 3rem));
        padding: 1.4rem 1.2rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: var(--bg-2);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      }

      .mark {
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #fffbf5;
        box-shadow: 0 0 0 1px var(--line);
      }

      .mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.7;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        letter-spacing: 0.06em;
        max-inline-size: 18rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.85rem 0.55rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="card" id="xamt-offline-page">
      <div class="mark" aria-hidden="true">
        <img src="/images/pwa-icon-192.png" alt="" width="38" height="38" />
      </div>
      <h1>You are offline</h1>
      <p>This page is not available without a network. The Mongolian font stays cached so text will still render when you return.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
